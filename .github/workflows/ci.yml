# SDXL Camera Angle · CI
# 零依赖项目：requirements.txt 只装标准库以外的东西（没有）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements (zero dependency)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Core unit tests
        run: python tests/test_core.py

      - name: Label parity check
        run: python tools/parity_check.py

      - name: Workflow structure check
        run: python tools/validate_workflow.py   # 无参数时校验 workflows/ 下全部 JSON（UI 格式与 API 格式都支持）

      - name: Repo self check (local mode)
        run: python tools/verify_repo.py
