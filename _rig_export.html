<!doctype html><html><head><meta charset="utf-8"><title>rig export</title>
<style>body{margin:0;background:#111}canvas{display:block}</style></head><body>
<canvas id="c" width="512" height="768"></canvas><pre id="out" style="color:#0f0;font-size:9px"></pre>
<script type="importmap">{"imports":{"three":"/js/three.module.js"}}</script>
<script type="module">
import { CameraRig } from "/js/camera_rig.js";
const rig = new CameraRig(document.getElementById("c"));
rig.setState({ pos_x: 0.5, pos_y: 0.25, pos_z: 0.1, roll: 0.0, focal: 50, pan_x: 0.0, pan_y: 0.0, subject_yaw: 0.35, gaze_mode: "auto" });
let out = { ok: false };
try {
  const d = rig.renderDepthDataURL(512, 768, { invert: true });
  const p = rig.renderPoseDataURL(512, 768);
  out = { ok: true, dlen: d.length, plen: p.length, d, p };
} catch (e) { out = { ok: false, err: String(e && e.stack || e) }; }
document.getElementById("out").textContent = JSON.stringify(out);
</script></body></html>
